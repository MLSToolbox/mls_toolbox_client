services:
  # Servicio de build: compila Angular y genera los archivos estáticos en ./dist/
  # Se ejecuta bajo demanda con: docker compose --profile build run --rm client-build
  client-build:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - client_node_modules:/app/node_modules
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-local}
    command: >
      sh -c "
        echo 'Configurando ambiente: $${ENVIRONMENT}' &&
        ENV_FILE=\"src/environment/environment.$${ENVIRONMENT}.ts\" &&
        if [ -f \"$$ENV_FILE\" ]; then
          cp \"$$ENV_FILE\" src/environment/environment.ts &&
          echo \"Usando configuración de: $$ENV_FILE\";
        else
          echo \"WARN: $$ENV_FILE no encontrado, usando environment.ts existente\";
        fi &&
        npm install &&
        npm run build &&
        echo 'Build completado en ./dist/frontend/'
      "
    profiles: ["build"]

  # Servicio de nginx: sirve los archivos compilados desde ./dist/frontend/
  client:
    image: nginx:latest
    container_name: ${CONTAINER_NAME:-mls_toolbox_client}
    volumes:
      - ./dist/frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${EXTERNAL_PORT:-4200}:80"
    networks:
      - mls-network
    restart: unless-stopped

volumes:
  client_node_modules:

networks:
  mls-network:
    name: ${DOCKER_NETWORK:-mls-network}
