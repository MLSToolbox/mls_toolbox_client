<div class="service-assignment-dashboard">

</div>

<div class="dashboard-root">
  <div class="templates" aria-hidden="true">
    <div class="template">Template A</div>
    <div class="template">Template B</div>
    <div class="template">Template C</div>
  </div>

  <div class="canvas" role="region" aria-label="Service assignment preview">
    <ng-container *ngIf="depthColumns.length > 0; else noColumns">
      <div class="depths-container">
        <ng-container *ngFor="let col of depthColumns">
          <div class="depth-column" [attr.data-depth]="col.depth">
            <div class="depth-body">
              <ng-container *ngFor="let s of col.nodes; trackBy: trackByStage">
                <div class="stage-wrapper">
                  <div
                    class="node-mock"
                    title="{{ s.label }}"
                    [class.assigned]="getAssignedService(s.id)"
                    [style.border-color]="getServiceColor(getAssignedService(s.id)) || 'var(--color-border-light, #e6e6e6)'"
                  >
                    <div class="node-title" [ngStyle]="s.color ? { 'background': s.color } : {}">
                      <ng-container *ngIf="getAssignedService(s.id) as srv; else titleDefault">
                        <span class="service-pill" [style.background]="getServiceColor(srv)">{{ srv }}</span>
                        <span
                          class="service-edit"
                          contenteditable="true"
                          (blur)="onServiceLabelBlur(s.id, $event)"
                          [attr.title]="'Edit service id (format svN)'"
                          >{{ srv }}</span
                        >
                        <button class="service-edit-btn" aria-hidden="true" type="button">✏️</button>
                      </ng-container>
                      <ng-template #titleDefault>
                        <span class="node-title-text">{{ s.label }}</span>
                      </ng-template>
                    </div>

                    <div class="node-body">
                      <div class="socket socket-left" aria-hidden="true"></div>
                      <div class="socket socket-right" aria-hidden="true"></div>
                      <div class="node-placeholder">
                        <div class="slot"></div>
                        <div class="slot"></div>
                      </div>
                    </div>
                  </div>

                  <div class="assign-actions">
                    <button
                      class="minus-btn"
                      *ngIf="canShowMinus(s.id)"
                      title="Remove service assignment"
                      type="button"
                      [attr.data-stage]="s.id"
                      (click)="hackClickMinus($event, s.id)"
                    >−</button>

                    <ng-container *ngFor="let opt of getPlusOptions(s.id)">
                      <button
                        class="plus-btn"
                        [style.background]="opt.color"
                        [attr.title]="opt.isNew ? 'Assign service' : 'Assign ' + opt.id"
                        type="button"
                        [attr.data-stage]="s.id"
                        [attr.data-opt-id]="opt.id"
                        [attr.data-opt-new]="opt.isNew ? '1' : '0'"
                        (click)="hackClickPlus($event, s.id, opt.id, !!opt.isNew)"
                      >
                        +
                      </button>
                    </ng-container>
                  </div>
                </div>
              </ng-container>
            </div>
          </div>
        </ng-container>
      </div>
    </ng-container>

    <ng-template #noColumns>
      <div class="empty-placeholder">No stages to display</div>
    </ng-template>
  </div>

  <div *ngIf="unassignedStageArray.length > 0" class="unassigned-section" aria-label="Unassigned stages">
    <div class="unassigned-title">Unassigned stages</div>
    <div class="unassigned-row">
      <ng-container *ngFor="let s of unassignedStageArray; trackBy: trackByStage">
        <div class="stage-wrapper">
          <div class="node-mock" title="{{ s.label }}">
            <div class="node-title" [ngStyle]="s.color ? { 'background': s.color } : {}">
              <span class="node-title-text">{{ s.label }}</span>
            </div>
            <div class="node-body">
              <div class="node-placeholder">
                <div class="slot"></div>
              </div>
            </div>
          </div>
        </div>
      </ng-container>
    </div>
  </div>

  <div class="spacer" aria-hidden="true"></div>

  <div class="dashboard-footer" role="toolbar" aria-label="Dashboard actions (visual only)">
    <div class="palette" aria-hidden="true">
      <div class="palette-label">Available services</div>
      <div class="palette-row">
        <span class="service-circle" style="background:#e6194b"></span>
        <span class="service-circle" style="background:#3cb44b"></span>
        <span class="service-circle" style="background:#ffe119"></span>
        <span class="service-circle" style="background:#4363d8"></span>
        <span class="service-circle" style="background:#f58231"></span>
        <span class="service-circle" style="background:#911eb4"></span>
        <span class="service-circle" style="background:#42d4f4"></span>
        <span class="service-circle" style="background:#f032e6"></span>
        <span class="service-circle" style="background:#bfef45"></span>
        <span class="service-circle" style="background:#469990"></span>
      </div>
    </div>

    <div class="action-area" aria-hidden="true">
      <button class="confirm-btn" disabled type="button">Confirm &amp; Generate</button>
    </div>
  </div>
</div>
