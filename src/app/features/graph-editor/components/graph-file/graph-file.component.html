<div class="file-actions-container">
  <h2>
    <i class="pi pi-file" style="margin-right: 8px;"></i>
    Pipeline File
  </h2>

  <div class="action-group">
    <div class="action-group-label">Create New</div>
    <button pButton class="action-button primary" (click)="clearEditor()">
      <i class="pi pi-file-plus"></i>
      Empty Pipeline
    </button>
    <button pButton class="action-button primary" (click)="showTemplates()">
      <i class="pi pi-clone"></i>
      From Template
    </button>
  </div>

  <div class="separator"></div>

  <div class="action-group">
    <div class="action-group-label">File Operations</div>
    <input
      type="file"
      #fileInput
      style="display: none"
      accept=".json,application/json"
      (change)="onFileSelected($event)"
    />
    <button pButton class="action-button primary" (click)="importPipeline()">
      <i class="pi pi-upload"></i>
      Load Pipeline
    </button>
    <button pButton class="action-button primary" (click)="downloadEditor()">
      <i class="pi pi-download"></i>
      Save Pipeline
    </button>
  </div>

  <div class="separator"></div>

  <div class="action-group">
    <div class="action-group-label">Export</div>
    <button pButton class="action-button accent" (click)="generateCode()">
      <i class="pi pi-code"></i>
      Generate Code as <script></script>
    </button>
    <button pButton class="action-button accent" (click)="openServicesDashboard()">
      Generate Code as Services
    </button>
  </div>

  <p-dialog
    header="Service Assignment"
    [(visible)]="showServiceDashboard"
    [modal]="true"
    [appendTo]="'body'"
    [style]="{ width: '70vw', left: '50%', transform: 'translateX(calc(-50% + 20px - 5vw))', maxWidth: 'min(70vw, calc(100vw - 360px))' }"
    [contentStyle]="{ 'min-height': '60vh', 'padding': '1.8rem' }"
    styleClass="service-assignment-dialog"
    [draggable]="false"
    [resizable]="false"
  >
    <app-service-assignment-dashboard
      [stages]="stagesForDialog"
      (close)="onDashboardClose()"
    ></app-service-assignment-dashboard>
  </p-dialog>
</div>
