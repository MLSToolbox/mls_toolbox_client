<!-- Header Container -->
<div class="frame-4 fixed lg:absolute top-0 lg:top-[17px] left-0 lg:left-1/2 lg:-translate-x-1/2 lg:ml-[113px] 
  w-full lg:w-[1200px] h-[60px] lg:h-[57px] 
  flex items-center justify-between bg-[#0f0f0f]  rounded-none lg:rounded-2xl overflow-hidden 
  px-4 lg:px-6 z-30 lg:z-auto">
  
  <!-- Title -->
  <h1 class="text-wrapper-5 font-semibold text-lg lg:text-xl text-white tracking-normal leading-normal whitespace-nowrap">
    Code Assessment
  </h1>
  
  <!-- Run Analysis Button -->
  <button 
    (click)="onRunAnalysis()"
    [disabled]="!canAnalyze || isAnalyzing"
    class="frame-5 flex h-9 lg:h-11 w-auto lg:w-[220px] items-center justify-center gap-2 lg:gap-[10px] 
    px-3 lg:px-6 py-2 lg:py-[10px] rounded-xl lg:rounded-2xl transition-all duration-200 cursor-pointer
    focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 focus:ring-offset-[#0f0f0f]"
    [class.bg-[#783ff2]]="canAnalyze && !isAnalyzing"
    [class.hover:bg-[#6835d1]]="canAnalyze && !isAnalyzing"
    [class.hover:shadow-lg]="canAnalyze && !isAnalyzing"
    [class.active:scale-95]="canAnalyze && !isAnalyzing"
    [class.bg-gray-600]="!canAnalyze || isAnalyzing"
    [class.cursor-not-allowed]="!canAnalyze || isAnalyzing"
    [class.opacity-50]="!canAnalyze || isAnalyzing"
    type="button"
    [attr.aria-label]="isAnalyzing ? 'Analyzing...' : 'Run analysis'"
  >
    <!-- Spinner cuando está analizando -->
    <div *ngIf="isAnalyzing" class="animate-spin rounded-full h-5 lg:h-6 w-5 lg:w-6 border-b-2 border-white"></div>
    
    <!-- Icono normal cuando no está analizando -->
    <img 
      *ngIf="!isAnalyzing"
      class="play-arrow w-5 lg:w-6 h-5 lg:h-6 flex-shrink-0" 
      src="/assets/play_arrow.svg" 
      alt="" 
      aria-hidden="true"
    />
    

    <span class="text-wrapper-6 font-medium text-white text-sm lg:text-base tracking-normal leading-normal whitespace-nowrap">
      <span class="hidden sm:inline">{{ isAnalyzing ? 'Analyzing...' : 'Run analysis' }}</span>
      <span class="sm:hidden">{{ isAnalyzing ? '...' : 'Run' }}</span>
    </span>
  </button>
</div>
