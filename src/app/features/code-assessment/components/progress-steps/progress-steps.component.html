<div class="bg-white rounded-xl p-6 mb-8 shadow-sm">
  <div class="flex items-center justify-between max-w-4xl mx-auto">
    <div 
      *ngFor="let step of steps; let i = index"
      class="flex flex-col items-center gap-2 relative"
      [class.flex-1]="i < steps.length - 1">
      
      <!-- Círculo del paso -->
      <div 
        class="w-12 h-12 rounded-full flex items-center justify-center font-semibold transition-all duration-300 z-10"
        [ngClass]="{
          'bg-green-600 text-white': step.status === 'completed',
          'text-white': step.status === 'active',
          'bg-gray-200 text-gray-600': step.status === 'pending'
        }"
        [style.background-color]="step.status === 'active' ? 'rgb(0, 32, 96)' : ''">
        
        <svg *ngIf="step.status === 'completed'" class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
        </svg>
        <span *ngIf="step.status !== 'completed'">{{ step.number }}</span>
      </div>

      <!-- Label -->
      <span 
        class="text-sm font-medium text-center"
        [ngClass]="{
          'text-gray-700': step.status === 'completed' || step.status === 'active',
          'text-gray-500': step.status === 'pending'
        }">
        {{ step.label }}
      </span>

      <!-- Línea conectora -->
      <div 
        *ngIf="i < steps.length - 1"
        class="absolute top-6 left-1/2 w-full h-0.5 -z-0"
        [ngClass]="{
          'bg-green-600': step.status === 'completed',
          'bg-gray-200': step.status !== 'completed'
        }"
        [style.background-color]="step.status === 'active' ? 'rgb(0, 32, 96)' : ''">
      </div>
    </div>
  </div>
</div>
