
<div class="frame-12 absolute top-[667px] left-[57px] w-[362px] h-[200px] bg-[#0c0c0c] rounded-2xl overflow-hidden">
  
  <div class="frame-13 flex flex-col w-[280px] items-start gap-2 absolute top-[21px] left-[21px]">
    
    
    <h2 class="text-wrapper-10 relative self-stretch mt-[-1px] font-semibold text-white text-lg tracking-normal leading-normal">
      Choose a type of analysis
    </h2>
    
    
    <p class="text-wrapper-11 relative self-stretch font-normal text-white text-sm tracking-normal leading-normal opacity-70">
      What would you like to know about your code?
    </p>
  </div>
  

  <div class="frame-14 flex flex-col w-[333px] items-start gap-[5px] absolute top-[108px] left-[21px]">
    
    <!-- Frame-15: Cohesion Option -->
    <label for="radio-cohesion" 
           class="frame-15 flex items-center gap-3 relative self-stretch w-full flex-[0_0_auto] cursor-pointer group">
      <div class="rectangle relative w-[18px] h-[18px] border-2 rounded-full flex items-center justify-center transition-colors"
           [class.border-[#bfed54]]="selectedAnalysisType === 'cohesion'"
           [class.border-gray-400]="selectedAnalysisType !== 'cohesion'">
        <div class="w-[10px] h-[10px] rounded-full transition-all"
             [class.bg-[#bfed54]]="selectedAnalysisType === 'cohesion'"
             [class.bg-transparent]="selectedAnalysisType !== 'cohesion'">
        </div>
      </div>
      <div class="text-wrapper-12 relative flex-1 font-normal text-sm tracking-normal leading-normal"
           [class.text-white]="selectedAnalysisType === 'cohesion'"
           [class.text-gray-400]="selectedAnalysisType !== 'cohesion'">
        Cohesion
      </div>
      <input 
        type="radio" 
        name="analysis-type" 
        value="cohesion" 
        [(ngModel)]="selectedAnalysisType"
        class="hidden"
        id="radio-cohesion"
      />
    </label>
    
    
    <label for="radio-coupling" 
           class="frame-17 flex items-center gap-3 relative self-stretch w-full flex-[0_0_auto] cursor-pointer group">
      <div class="rectangle relative w-[18px] h-[18px] border-2 rounded-full flex items-center justify-center transition-colors"
           [class.border-[#bfed54]]="selectedAnalysisType === 'coupling'"
           [class.border-gray-400]="selectedAnalysisType !== 'coupling'">
        <div class="w-[10px] h-[10px] rounded-full transition-all"
             [class.bg-[#bfed54]]="selectedAnalysisType === 'coupling'"
             [class.bg-transparent]="selectedAnalysisType !== 'coupling'">
        </div>
      </div>
      <div class="text-wrapper-13 relative flex-1 font-normal text-sm tracking-normal leading-normal"
           [class.text-white]="selectedAnalysisType === 'coupling'"
           [class.text-gray-400]="selectedAnalysisType !== 'coupling'">
        Coupling
      </div>
      <input 
        type="radio" 
        name="analysis-type" 
        value="coupling" 
        [(ngModel)]="selectedAnalysisType"
        class="hidden"
        id="radio-coupling"
      />
    </label>
    
   
    <label for="radio-all" 
           class="frame-18 flex items-center gap-3 relative self-stretch w-full flex-[0_0_auto] cursor-pointer group">
      <div class="rectangle relative w-[18px] h-[18px] border-2 rounded-full flex items-center justify-center transition-colors"
           [class.border-[#bfed54]]="selectedAnalysisType === 'all'"
           [class.border-gray-400]="selectedAnalysisType !== 'all'">
        <div class="w-[10px] h-[10px] rounded-full transition-all"
             [class.bg-[#bfed54]]="selectedAnalysisType === 'all'"
             [class.bg-transparent]="selectedAnalysisType !== 'all'">
        </div>
      </div>
      <div class="text-wrapper-14 relative flex-1 font-normal text-sm tracking-normal leading-normal"
           [class.text-white]="selectedAnalysisType === 'all'"
           [class.text-gray-400]="selectedAnalysisType !== 'all'">
        All
      </div>
      <input 
        type="radio" 
        name="analysis-type" 
        value="all" 
        [(ngModel)]="selectedAnalysisType"
        class="hidden"
        id="radio-all"
      />
    </label>
  </div>
  
</div>
