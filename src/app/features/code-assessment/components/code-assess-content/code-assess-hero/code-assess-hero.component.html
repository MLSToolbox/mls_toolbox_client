<!-- Frame-8: Hero Section (siguiendo diseño Figma) -->
<div class="frame-8 absolute top-[53px] left-[calc(50%-537px)] w-[1075px] h-[207px] rounded-2xl overflow-hidden">
  
  <!-- Richard Horvath: Background Image -->
  <img 
    class="richard-horvath absolute top-0 left-0 w-[1075px] h-[207px] object-cover" 
    src="/assets/richard-horvath-nwaetf6qo0-unsplash.png" 
    alt=""
    aria-hidden="true"
  />
  
  <!-- Ellipse: Purple blur effect -->
  <div class="ellipse absolute top-[107px] left-[48px] w-[106px] h-[100px] bg-[#8857aa] rounded-[53px/50px] blur-[26.15px]"></div>
  
  <!-- Frame-9: Content Container -->
  <div class="frame-9 flex flex-col w-[628px] items-center gap-5 absolute top-[25px] left-[224px]">
    
    <!-- Frame-10: Text Content -->
    <div class="frame-10 flex flex-col items-start gap-4 relative self-stretch w-full flex-[0_0_auto]">
      
      <!-- P: Main Title -->
      <h1 class="p relative self-stretch -mt-px font-semibold text-white text-[32px] text-center tracking-normal leading-normal">
        Let's start analyzing your project
      </h1>
      
      <!-- Text Wrapper 8: Description -->
      <p class="text-wrapper-8 relative self-stretch font-normal text-white text-base text-center tracking-normal leading-normal">
        Understand your code's structure and learn how to take it to the next level — no software engineering experience required.
      </p>
    </div>
    
    <!-- Frame-11: Upload Button -->
    <label 
      class="frame-11 flex w-[600px] items-center justify-center gap-2 p-[10px] relative flex-[0_0_auto] bg-[#bfed54] rounded-2xl cursor-pointer hover:bg-[#a8d447] transition-colors"
      for="project-upload"
    >
      <img 
        class="img relative w-6 h-6" 
        src="/assets/file-upload-rounded.svg" 
        alt=""
        aria-hidden="true"
      />
      <div class="text-wrapper-9 relative w-fit h-[19px] font-semibold text-[#0c0101] text-base text-center tracking-normal leading-normal whitespace-nowrap">
        Upload project (.zip)
      </div>
      <input
        type="file"
        id="project-upload"
        name="project-upload"
        accept=".zip"
        class="hidden"
        (change)="onFileSelected($event)"
        aria-label="Upload project zip file"
      />
    </label>
  </div>
  
</div>
