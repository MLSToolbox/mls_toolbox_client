<div 
  (click)="onToggle()"
  class="bg-white border-2 rounded-xl p-6 cursor-pointer transition-all duration-300 hover:-translate-y-1 hover:shadow-md"
  [ngClass]="{
    'border-gray-200': !selected,
    'border-transparent shadow-lg': selected
  }"
  [style.background]="selected ? 'linear-gradient(135deg, rgb(0, 32, 96) 0%, rgb(0, 50, 120) 100%)' : ''">
  
  <div class="flex items-start justify-between mb-4">
    <!-- Icono -->
    <div 
      class="w-10 h-10 rounded-lg flex items-center justify-center transition-all duration-300"
      [ngClass]="{
        'bg-opacity-10': !selected
      }"
      [style.background-color]="!selected ? 'rgba(0, 32, 96, 0.1)' : 'rgba(255, 255, 255, 0.2)'">
      <span class="text-xl" [ngClass]="selected ? 'grayscale-0' : ''">{{ metric.icon }}</span>
    </div>
    
    <!-- Checkmark -->
    <div 
      class="w-6 h-6 rounded-full flex items-center justify-center transition-all duration-300"
      [ngClass]="{
        'bg-gray-200': !selected,
        'bg-white': selected
      }">
      <svg 
        *ngIf="selected" 
        class="w-4 h-4" 
        style="color: rgb(0, 32, 96);" 
        fill="currentColor" 
        viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
      </svg>
    </div>
  </div>
  
  <!-- Título -->
  <h3 
    class="text-lg font-semibold mb-2 transition-colors duration-300"
    [ngClass]="{
      'text-white': selected
    }"
    [style.color]="!selected ? 'rgb(0, 32, 96)' : ''">
    {{ metric.name }}
  </h3>
  
  <!-- Descripción -->
  <p 
    class="text-sm leading-relaxed transition-colors duration-300"
    [ngClass]="{
      'text-white opacity-90': selected,
      'text-gray-600': !selected
    }">
    {{ metric.description }}
  </p>
</div>
