<div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100">
  <h3 class="font-semibold mb-4" style="color: rgb(0, 32, 96);">{{ title }}</h3>
  <div class="space-y-3">
    <div *ngFor="let item of items" class="flex items-center justify-between text-sm">
      <div class="flex items-center gap-2 text-gray-600">
        <span *ngIf="item.icon" class="text-base">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
      </div>
      <span class="font-medium" style="color: rgb(0, 32, 96);">{{ item.value }}</span>
    </div>
  </div>
</div>
