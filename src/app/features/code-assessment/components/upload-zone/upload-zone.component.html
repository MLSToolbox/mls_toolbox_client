<div class="bg-white rounded-xl p-12 shadow-sm text-center">
  <div class="max-w-xl mx-auto">
    <!-- Icono -->
    <div class="w-24 h-24 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-md"
         style="background: linear-gradient(135deg, rgba(0, 32, 96, 0.1) 0%, rgba(153, 204, 204, 0.2) 100%);">
      <svg class="w-12 h-12" style="color: rgb(0, 32, 96);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
      </svg>
    </div>
    
    <!-- Título y descripción -->
    <h2 class="text-2xl font-semibold mb-3" style="color: rgb(0, 32, 96);">Upload Your Project</h2>
    <p class="text-gray-600 mb-8">Drag your .zip file here or click to select</p>
    
    <!-- Zona de drop -->
    <div 
      class="border-2 border-dashed rounded-xl p-12 transition-all duration-300 cursor-pointer"
      [ngClass]="{
        'border-gray-300 hover:border-gray-400 hover:bg-gray-50': !isDragging,
        'bg-blue-50': isDragging
      }"
      [style.border-color]="isDragging ? 'rgb(0, 32, 96)' : ''"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)">
      
      <input 
        type="file" 
        id="fileInput" 
        class="hidden" 
        accept=".zip"
        (change)="onFileSelected($event)">
      
      <label for="fileInput" class="cursor-pointer">
        <div class="flex flex-col items-center gap-4">
          <svg class="w-16 h-16 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
          </svg>
          <div>
            <p class="text-gray-700 font-medium mb-1">Click to upload or drag and drop</p>
            <p class="text-sm text-gray-500">ZIP files only (Max 50MB)</p>
          </div>
        </div>
      </label>
    </div>
  </div>
</div>
