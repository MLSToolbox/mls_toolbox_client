<div class="bg-white border rounded-xl p-6 transition-all duration-300 hover:shadow-md" [ngClass]="borderColorClass">
  <div class="flex items-start justify-between mb-4">
    <div>
      <h4 class="text-lg font-semibold mb-1" style="color: rgb(0, 32, 96);">{{ result.name }}</h4>
      <p class="text-sm text-gray-600">{{ result.status }}</p>
    </div>
    
    <div class="flex items-center gap-3">
      <!-- Score -->
      <div class="text-right">
        <div class="text-2xl font-bold" style="color: rgb(0, 32, 96);">{{ result.score }}</div>
        <div class="text-xs text-gray-500">/ 100</div>
      </div>
      
      <!-- Icon -->
      <div class="w-10 h-10 rounded-full flex items-center justify-center text-lg" [ngClass]="iconBgClass">
        {{ statusIcon }}
      </div>
    </div>
  </div>
  
  <!-- Message -->
  <p class="text-sm text-gray-700 leading-relaxed">
    {{ result.message }}
  </p>
  
  <!-- Progress bar -->
  <div class="mt-4 h-2 bg-gray-200 rounded-full overflow-hidden">
    <div 
      class="h-full rounded-full transition-all duration-1000"
      [style.width.%]="result.score"
      [ngClass]="{
        'bg-green-500': result.color === 'green',
        'bg-yellow-500': result.color === 'yellow',
        'bg-orange-500': result.color === 'orange',
        'bg-red-500': result.color === 'red'
      }">
    </div>
  </div>
</div>
