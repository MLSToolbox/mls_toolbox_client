<div class="min-h-screen flex flex-col bg-gray-50">
  <!-- Header (reutilizado) -->
  <app-header></app-header>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col">
    <!-- Page Title -->
    <div class="bg-white border-b border-gray-100">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="flex items-center justify-between">
          <div>
            <h1 class="text-3xl font-bold tracking-tight" style="color: rgb(0, 32, 96);">
              Code Assessment
            </h1>
            <p class="mt-1 text-sm text-gray-600">
              Analyze your Python project quality with comprehensive metrics
            </p>
          </div>
          <a 
            [routerLink]="['/']"
            class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors duration-200 flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            Volver al Home
          </a>
        </div>
      </div>
    </div>

    <!-- Stepper -->
    <app-assessment-stepper
      *ngIf="state$ | async as state"
      [steps]="steps"
      [currentStep]="state.currentStep">
    </app-assessment-stepper>

    <!-- Content Area -->
    <div class="flex-1" *ngIf="state$ | async as state">
      <!-- Step 1: Upload -->
      <app-assessment-upload
        *ngIf="state.currentStep === 1"
        [uploadedFileName]="state.uploadedFile?.name || null"
        (fileSelected)="onFileSelected($event)">
      </app-assessment-upload>

      <!-- Step 2: Choose Metrics (placeholder) -->
      <div *ngIf="state.currentStep === 2" class="flex-1 flex items-center justify-center p-8">
        <div class="text-center">
          <h2 class="text-2xl font-bold mb-2" style="color: rgb(0, 32, 96);">Choose Metrics</h2>
          <p class="text-gray-600">Step 2 coming soon...</p>
        </div>
      </div>

      <!-- Step 3: Analysis (placeholder) -->
      <div *ngIf="state.currentStep === 3" class="flex-1 flex items-center justify-center p-8">
        <div class="text-center">
          <h2 class="text-2xl font-bold mb-2" style="color: rgb(0, 32, 96);">Analysis</h2>
          <p class="text-gray-600">Step 3 coming soon...</p>
        </div>
      </div>

      <!-- Step 4: Results (placeholder) -->
      <div *ngIf="state.currentStep === 4" class="flex-1 flex items-center justify-center p-8">
        <div class="text-center">
          <h2 class="text-2xl font-bold mb-2" style="color: rgb(0, 32, 96);">Results</h2>
          <p class="text-gray-600">Step 4 coming soon...</p>
        </div>
      </div>
    </div>
  </div>
</div>
