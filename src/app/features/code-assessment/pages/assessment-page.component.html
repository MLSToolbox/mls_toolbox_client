<!-- Main Content -->
<div class="flex flex-col bg-gray-50 min-h-screen">
  <!-- Page Header - Compact -->
  <div class="bg-gradient-to-r from-blue-50 to-indigo-50 border-b border-blue-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center shadow-lg">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
          </div>
          <div>
            <h1 class="text-xl font-bold" style="color: rgb(0, 32, 96);">Code Assessment</h1>
            <p class="text-xs text-gray-600">Python project quality analyzer</p>
          </div>
        </div>
        
        <!-- Reset Button -->
        <button 
          *ngIf="state && (state.uploadedFile || state.sessionId)"
          (click)="onResetAssessment()"
          [disabled]="state.isUploading || state.isAnalyzing"
          class="px-4 py-2 text-xs font-medium text-white rounded-lg transition-all duration-200 flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed shadow-md hover:shadow-lg"
          style="background: linear-gradient(135deg, rgb(0, 32, 96) 0%, rgb(0, 50, 120) 100%);">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
          New Assessment
        </button>
      </div>
    </div>
  </div>

  <!-- Stepper -->
  <app-assessment-stepper
    [steps]="steps"
    [currentStep]="state.currentStep"
    [isLoading]="state.isUploading || state.isAnalyzing"
    [stepDescription]="getStepDescription()"
    (stepChange)="onStepChange($event)">
  </app-assessment-stepper>

  <!-- Error Alert (Global) -->
  <div *ngIf="state.error as error" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">
    <div class="bg-red-50 border border-red-200 rounded-lg p-4">
      <div class="flex items-start justify-between">
        <div class="flex gap-3">
          <svg class="w-5 h-5 text-red-600 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <div>
            <p class="text-sm font-medium text-red-900">{{ error.message }}</p>
            <p *ngIf="error.code" class="text-xs text-red-700 mt-1">Error Code: {{ error.code }}</p>
          </div>
        </div>
        <button 
          (click)="onClearError()"
          class="text-red-600 hover:text-red-800 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Content Area -->
  <div class="pb-8">
    <!-- Step 1: Upload -->
    <app-assessment-upload
      *ngIf="state.currentStep === StepEnum.UPLOAD"
      [uploadedFileName]="state.uploadedFile?.name || null"
      [isUploading]="state.isUploading"
      [errorMessage]="getUploadErrorMessage()"
      [fileSize]="getFileSize()"
      (fileSelected)="onFileSelected($event)"
      (reset)="onUploadReset()">
    </app-assessment-upload>

    <!-- Step 2: Project Structure & Metrics Selection -->
    <div *ngIf="state.currentStep === StepEnum.STRUCTURE" class="py-8 bg-gray-50">
      <app-assessment-structure
        [projectStructure]="state.uploadResponse?.tree_structure || null"
        [availableMetrics]="availableMetrics"
        [isAnalyzing]="state.isAnalyzing"
        (runAnalysis)="onRunAnalysis($event)"
        (back)="onBackToUpload()">
      </app-assessment-structure>
    </div>
    
    <!-- Step 3: Analysis -->
    <div *ngIf="state.currentStep === StepEnum.ANALYSIS" class="flex items-center justify-center py-16 px-8 bg-gray-50">
      <div class="text-center max-w-md">
        <div class="mb-6">
          <div class="w-24 h-24 mx-auto rounded-full bg-blue-100 flex items-center justify-center">
            <svg class="w-12 h-12 text-blue-600 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </div>
        </div>
        <h2 class="text-2xl font-bold mb-2" style="color: rgb(0, 32, 96);">Analyzing Your Code</h2>
        <p class="text-gray-600 mb-6">
          Please wait while we analyze your project. This may take a few moments...
        </p>
        <div class="bg-blue-50 rounded-lg p-4 border border-blue-100">
          <p class="text-sm text-blue-700">
            We're examining your code structure, calculating metrics, and generating insights.
          </p>
        </div>
      </div>
    </div>

    <!-- Step 4: Results -->
    <div *ngIf="state.currentStep === StepEnum.RESULTS" class="py-8 px-4 bg-gray-50">
      <app-assessment-results
        [results]="state.analysisResponse"
        (newAnalysis)="onResetAssessment()"
        (exportResults)="onExportResults()">
      </app-assessment-results>
    </div>
  </div>
</div>
