<div class="relative overflow-hidden text-white py-20" 
     style="background: linear-gradient(135deg, rgb(0, 32, 96) 0%, rgb(0, 50, 120) 100%);">
  
  <!-- Patrón de fondo decorativo -->
  <div class="absolute inset-0 opacity-10">
    <div class="absolute top-0 left-0 w-96 h-96 bg-white rounded-full -translate-x-1/2 -translate-y-1/2 blur-3xl"></div>
    <div class="absolute bottom-0 right-0 w-96 h-96 bg-white rounded-full translate-x-1/2 translate-y-1/2 blur-3xl"></div>
  </div>
  
  <!-- Contenido -->
  <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
    <h1 class="text-5xl md:text-6xl font-bold mb-6 tracking-tight">
      {{ title }}
    </h1>
    <p class="text-xl md:text-2xl opacity-90 max-w-3xl mx-auto leading-relaxed">
      {{ subtitle }}
    </p>
    
    <!-- Línea decorativa -->
    <div class="flex items-center justify-center mt-8 gap-3">
      <div class="h-1 w-20 rounded-full" style="background-color: rgb(153, 204, 204);"></div>
      <div class="h-1 w-1 rounded-full bg-white opacity-50"></div>
      <div class="h-1 w-20 rounded-full" style="background-color: rgb(153, 204, 204);"></div>
    </div>
  </div>
</div>
