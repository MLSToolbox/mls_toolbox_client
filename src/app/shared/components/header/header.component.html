<nav class="bg-white border-b border-gray-100 z-50 backdrop-blur-sm bg-white/95">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-20">
      <!-- Logo -->
      <div class="flex items-center">
        <a [routerLink]="['/']" class="flex flex-col items-start group cursor-pointer">
          <img
            src="assets/horizontal.png"
            alt="MLS Toolbox"
            class="h-16 md:h-14 w-auto transition-transform duration-300 group-hover:scale-[1.02]"
          />
          <div class="h-0.5 w-0 group-hover:w-full transition-all duration-300 rounded-full" style="background-color: rgb(153, 204, 204);"></div>
        </a>
      </div>

      <!-- Navegación -->
      <div class="flex gap-2">
        <a 
          [routerLink]="['/']" 
          routerLinkActive="nav-active"
          [routerLinkActiveOptions]="{exact: true}"
          class="px-5 py-2 rounded-lg font-medium transition-all duration-200 hover:bg-gray-50 relative overflow-hidden group"
          style="color: rgb(0, 32, 96);">
          <span class="relative z-10">Home</span>
          <div class="absolute bottom-0 left-0 w-full h-0.5 transform scale-x-0 group-hover:scale-x-100 transition-transform duration-300" 
               style="background-color: rgb(153, 204, 204);"></div>
        </a>
        <button 
          (click)="navigateToWiki()"
          class="px-5 py-2 rounded-lg font-medium transition-all duration-200 hover:bg-gray-50 relative overflow-hidden group"
          style="color: rgb(0, 32, 96);">
          <span class="relative z-10">About Us</span>
          <div class="absolute bottom-0 left-0 w-full h-0.5 transform scale-x-0 group-hover:scale-x-100 transition-transform duration-300" 
               style="background-color: rgb(153, 204, 204);"></div>
        </button>
      </div>
    </div>
