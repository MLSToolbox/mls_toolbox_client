<div class="bg-white border-b border-gray-200 px-6 py-4 shadow-sm">
  <div class="flex items-center gap-4">
    <!-- Icon -->
    <div class="w-12 h-12 rounded-lg flex items-center justify-center flex-shrink-0" style="background-color: rgb(0, 32, 96);">
      <i [class]="'pi ' + iconClass + ' text-white text-xl'"></i>
    </div>
    
    <!-- Tool Info -->
    <div>
      <h2 class="text-xl font-bold" style="color: rgb(0, 32, 96);">{{ toolName }}</h2>
      <p class="text-sm text-gray-600">{{ toolDescription }}</p>
    </div>
  </div>
</div>
